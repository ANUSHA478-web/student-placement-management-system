
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 30px;
            color: #243247;
        }
        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #17365d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form method="POST">
        <h1>Add Student</h1>

        <label>Name</label>
        <input name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Branch</label>
        <input name="branch" required>

        <label>CGPA</label>
        <input type="number" name="cgpa"
               min="0" max="10" step="0.01" required>

        <label>Number of Backlogs</label>
        <input type="number" name="backlogs"
               min="0" step="1" required>

        <label>Skills</label>
        <input name="skills" required>

        <button type="submit">Save Student</button>
        <p><a href="/students">View Student Records</a></p>
    </form>
</body>
</html>
